worker_processes auto;
pid /tmp/nginx.pid;
# Nginx error messages can include the complete request URI (reset link secrets).
# Operational availability is monitored through healthchecks, without request logs.
error_log /dev/null emerg;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_max_body_size 64k;
  client_body_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  upstream backend { server backend:3001; }
  upstream frontend { server frontend:3000; }
  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /tls/cert.pem;
    ssl_certificate_key /tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /proxy-health { access_log off; return 200 'ok'; }
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    location /auth/ { gzip off; proxy_pass http://backend; }
    location = /health { gzip off; proxy_pass http://backend; }
    location = /health/ready { gzip off; proxy_pass http://backend; }
    location = /reset-password { gzip off; proxy_pass http://frontend; }
    location / { proxy_pass http://frontend; }
  }
}
