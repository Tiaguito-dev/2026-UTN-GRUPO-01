services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utn_grupo_01}
      POSTGRES_USER: ${POSTGRES_USER:-utn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-utn_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-utn} -d ${POSTGRES_DB:-utn_grupo_01}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
